function renderHud(){document.querySelector('#hudText').textContent=`${conditions.paused?'PAUSED':'SIMULATION LIVE'} · ${entities.length} OBJECT${entities.length===1?'':'S'}`}function sync(){document.querySelector('#temp').value=conditions.temperatureK;document.querySelector('#pressure').value=Math.round(conditions.pressureAtm*100);document.querySelector('#gravity').value=Math.round(conditions.gravity);document.querySelector('#speed').value=Math.round(conditions.speed*10);document.querySelector('#tempOut').textContent=`${conditions.temperatureK} K`;document.querySelector('#pressureOut').textContent=`${conditions.pressureAtm.toFixed(2)} atm`;document.querySelector('#gravityOut').textContent=`${conditions.gravity.toFixed(1)} m/s²`;document.querySelector('#speedOut').textContent=`${conditions.speed.toFixed(1)}×`;document.querySelector('#pause').textContent=conditions.paused?'▶ RESUME':'Ⅱ PAUSE';renderHud()}document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{activeTab=t.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));renderCatalog()});document.querySelector('#temp').oninput=x=>{conditions.temperatureK=+x.target.value;for(const e of entities)if(e.kind==='element')refreshVisual(e);sync();renderInspector()};document.querySelector('#pressure').oninput=x=>{conditions.pressureAtm=+x.target.value/100;for(const e of entities)if(e.kind==='element')refreshVisual(e);sync();renderInspector()};document.querySelector('#gravity').oninput=x=>{conditions.gravity=+x.target.value;sync()};document.querySelector('#speed').oninput=x=>{conditions.speed=+x.target.value/10;sync()};document.querySelector('#pause').onclick=()=>{conditions.paused=!conditions.paused;sync()};
function cast(ev){const r=canvas.getBoundingClientRect();pointer.set(((ev.clientX-r.left)/r.width)*2-1,-((ev.clientY-r.top)/r.height)*2+1);ray.setFromCamera(pointer,camera)}canvas.addEventListener('contextmenu',e=>e.preventDefault());canvas.addEventListener('pointerdown',ev=>{cast(ev);const h=ray.intersectObjects(entities.map(e=>e.mesh),false)[0];if(ev.button===0&&h){drag={entity:h.object.userData.entity,depth:h.point.distanceTo(camera.position),last:h.point.clone(),velocity:new THREE.Vector3(),at:performance.now()};select(drag.entity);canvas.setPointerCapture(ev.pointerId)}else orbit={x:ev.clientX,y:ev.clientY,button:ev.button}});canvas.addEventListener('pointermove',ev=>{if(drag){cast(ev);const p=ray.ray.at(drag.depth,new THREE.Vector3()),now=performance.now(),elapsed=Math.max(.016,(now-drag.at)/1000);drag.velocity.copy(p).sub(drag.last).multiplyScalar(1/elapsed);drag.last.copy(p);drag.at=now;drag.entity.mesh.position.copy(p);drag.entity.velocity.set(0,0,0);return}if(orbit){const dx=ev.clientX-orbit.x,dy=ev.clientY-orbit.y;if(orbit.button===2){yaw-=dx*.007;pitch=Math.max(-1.25,Math.min(.18,pitch-dy*.007))}else if(orbit.button===1){const right=new THREE.Vector3();camera.getWorldDirection(right);right.cross(camera.up).normalize();focus.addScaledVector(right,-dx*.012);focus.y+=dy*.012}updateCamera();orbit.x=ev.clientX;orbit.y=ev.clientY}});canvas.addEventListener('pointerup',()=>{if(drag?.entity?.velocity)drag.entity.velocity.copy(drag.velocity).multiplyScalar(.24);drag=null;orbit=null});canvas.addEventListener('wheel',e=>{dist=Math.max(6,Math.min(34,dist+e.deltaY*.012));updateCamera()},{passive:true});addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;keys.add(e.code);if(e.code==='Space'){e.preventDefault();conditions.paused=!conditions.paused;sync()}if(e.code==='Delete'&&selectedEntity)remove(selectedEntity)});addEventListener('keyup',e=>keys.delete(e.code));
function burst(pos,color){for(let i=0;i<24;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.045,8,7),new THREE.MeshBasicMaterial({color,transparent:true}));m.position.copy(pos);m.userData={life:1.3+Math.random()*.8,v:new THREE.Vector3((Math.random()-.5)*2,Math.random()*2.3,(Math.random()-.5)*2)};scene.add(m);effects.push(m)}}function react(e){if(e.kind!=='element'||e.element.symbol!=='Na'||e.reacting)return;const water=entities.find(o=>o.water&&o.mesh.position.distanceTo(e.mesh.position)<1.25);if(!water)return;e.reacting=true;burst(e.mesh.position,'#d8f7ff');toast('Reaction rule: sodium + water → sodium hydroxide + hydrogen + heat.');e.mesh.material.color.set('#ffb04a');setTimeout(()=>entities.includes(e)&&remove(e),1050)}
function tick(){requestAnimationFrame(tick);const dt=Math.min(clock.getDelta(),.05)*conditions.speed;if(!conditions.paused){const pan=dt*5,f=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw)),r=new THREE.Vector3(f.z,0,-f.x);if(keys.has('KeyW'))focus.addScaledVector(f,-pan);if(keys.has('KeyS'))focus.addScaledVector(f,pan);if(keys.has('KeyA'))focus.addScaledVector(r,-pan);if(keys.has('KeyD'))focus.addScaledVector(r,pan);if(keys.has('KeyQ'))focus.y-=pan;if(keys.has('KeyE'))focus.y+=pan;for(const e of entities){if(drag?.entity===e||e.kind!=='element')continue;e.velocity.y-=conditions.gravity*dt;e.mesh.position.addScaledVector(e.velocity,dt);const z=e.radius;if(e.mesh.position.y<z){e.mesh.position.y=z;e.velocity.y=Math.abs(e.velocity.y)*.22;e.velocity.x*=.84;e.velocity.z*=.84}for(const a of ['x','z'])if(Math.abs(e.mesh.position[a])>WORLD-z){e.mesh.position[a]=Math.sign(e.mesh.position[a])*(WORLD-z);e.velocity[a]*=-.42}if(e.velocity.length()>.1)react(e)}for(let i=effects.length-1;i>=0;i--){const x=effects[i];x.position.addScaledVector(x.userData.v,dt);x.userData.v.y-=2*dt;x.userData.life-=dt;x.material.opacity=Math.max(0,x.userData.life);if(x.userData.life<=0){scene.remove(x);x.geometry.dispose();x.material.dispose();effects.splice(i,1)}}updateCamera()}if(selectedEntity){selection.visible=true;selection.setFromObject(selectedEntity.mesh)}else selection.visible=false;if(toastTimer>0&&(toastTimer-=dt)<=0)document.querySelector('#toast').classList.remove('show');renderer.render(scene,camera)}addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});try{elements=await fetch('./data/elements.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('element data unavailable');return r.json()});selectedElement=elements.find(e=>e.symbol==='Na');renderCatalog();renderInspector();sync();toast('ChemLab Sandbox loaded — choose an element to begin.');tick()}catch(e){document.querySelector('#inspector').innerHTML=`<h2>Data load failed</h2><p class="description">${e.message}</p>`;console.error(e)}
</script></body></html>
