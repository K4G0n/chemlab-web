<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'"><title>ChemLab 2D Sandbox</title>
<style>
:root{--bg:#07111f;--panel:#0b1729f2;--line:#294664;--ink:#e9f4ff;--muted:#95aac2;--aqua:#54efcf;--blue:#4ea8ff;--orange:#ffb25a;--red:#ff6576}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font:13px ui-rounded,"Avenir Next",system-ui,sans-serif;color:var(--ink)}button,input{font:inherit}.panel{background:var(--panel);border:1px solid var(--line);box-shadow:0 12px 34px #02081180;backdrop-filter:blur(16px)}#playground{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}.top{position:fixed;z-index:5;left:14px;right:14px;top:13px;height:48px;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:14px;pointer-events:auto}.logo{font-size:16px;font-weight:900;letter-spacing:.1em;color:var(--aqua);padding:0 8px}.logo span{font:10px ui-monospace,monospace;background:var(--aqua);color:#082025;padding:3px 5px;border-radius:4px;margin-left:5px}.spacer{flex:1}.btn{border:1px solid #385878;background:#12263d;color:var(--ink);border-radius:8px;padding:7px 9px;font-size:11px;font-weight:700;cursor:pointer}.btn:hover{border-color:var(--aqua)}.btn.danger{border-color:#7c3c50;color:#ffc1c8;background:#351722}.btn.primary{background:var(--aqua);border-color:var(--aqua);color:#062024}
#catalog{position:fixed;z-index:4;top:73px;bottom:15px;left:14px;width:295px;border-radius:15px;display:flex;flex-direction:column;overflow:hidden;pointer-events:auto}.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}.tab{border:0;background:transparent;padding:12px 4px;color:var(--muted);font-size:10px;font-weight:800;cursor:pointer}.tab.active{color:var(--aqua);box-shadow:inset 0 -2px var(--aqua)}.catalog-body{padding:12px;overflow:auto}.search{width:100%;border:1px solid #315272;background:#102139;color:var(--ink);border-radius:8px;padding:9px;outline:none}.search:focus{border-color:var(--aqua)}.group{margin-top:14px}.group h3{margin:0 0 7px;color:#9db4d0;font:10px ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.item{min-height:50px;padding:3px;border:1px solid #2a4968;background:#11253e;border-radius:7px;color:var(--ink);cursor:pointer;text-align:center}.item:hover,.item.selected{border-color:var(--aqua);background:#173550}.item b{display:block;font-size:16px}.item small{display:block;font-size:9px;color:#abc0d8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.spawn-item{width:100%;text-align:left;border:1px solid #294866;background:#11243b;color:var(--ink);padding:10px;border-radius:9px;margin:6px 0;cursor:pointer}.spawn-item:hover,.spawn-item.selected{border-color:var(--aqua)}.spawn-item b{display:block}.spawn-item span{display:block;font-size:10px;color:var(--muted);margin-top:2px}
#inspector{position:fixed;z-index:4;right:14px;top:73px;width:310px;max-height:calc(100vh - 88px);overflow:auto;border-radius:15px;padding:15px;pointer-events:auto}.eyebrow{font:10px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.1em;color:var(--aqua)}.head{display:flex;gap:12px;align-items:center;margin:9px 0 11px}.symbol{width:50px;height:50px;display:grid;place-items:center;border:1px solid #4c7395;border-radius:12px;background:#17334c;font-size:22px;font-weight:900}.head h2{margin:0;font-size:19px}.head p{margin:3px 0;color:var(--muted);font-size:11px}.desc{font-size:11px;line-height:1.45;color:#c6d5e6;padding-bottom:11px;border-bottom:1px solid var(--line)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:11px}.stat{padding:7px;border:1px solid #203c58;background:#0d1d31;border-radius:7px}.stat span{display:block;color:#8fa8c6;font:9px ui-monospace,monospace}.stat b{display:block;margin-top:3px;font-size:11px;overflow-wrap:anywhere}.wide{grid-column:1/-1}.selection-actions{display:flex;gap:7px;margin-top:12px}.selection-actions .btn{flex:1}.hint{margin-top:11px;font-size:10px;line-height:1.45;color:var(--muted)}
#conditions{position:fixed;z-index:4;left:324px;bottom:15px;width:470px;padding:12px 14px;border-radius:14px;pointer-events:auto}.condition-head{display:flex;align-items:center;justify-content:space-between}.condition-head b{font-size:12px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin-top:9px}.control{display:grid;grid-template-columns:73px 1fr 52px;gap:6px;align-items:center;color:#b4c9df;font-size:10px}.control output{font:10px ui-monospace,monospace;color:var(--aqua);text-align:right}input[type=range]{width:100%;accent-color:var(--aqua)}#status{position:fixed;z-index:4;right:335px;bottom:16px;border-radius:10px;padding:8px 11px;font:10px ui-monospace,monospace;color:#c5d8ec;pointer-events:none}.dot{display:inline-block;width:7px;height:7px;border-radius:99px;background:var(--aqua);margin-right:6px;box-shadow:0 0 8px var(--aqua)}#toast{position:fixed;z-index:8;left:50%;bottom:24px;translate:-50% 14px;opacity:0;transition:.18s;padding:9px 12px;border-radius:9px;pointer-events:none}.show{opacity:1!important;translate:-50% 0!important}.context{position:fixed;z-index:10;display:none;width:150px;padding:5px;border-radius:9px;pointer-events:auto}.context button{width:100%;text-align:left;border:0;background:transparent;color:var(--ink);padding:8px;border-radius:6px;cursor:pointer;font-size:11px}.context button:hover{background:#193550}.modal{position:fixed;z-index:12;inset:0;display:none;place-items:center;background:#041020b8;pointer-events:auto}.modal.open{display:grid}.modal-card{width:min(620px,calc(100vw - 30px));max-height:80vh;overflow:auto;padding:20px;border-radius:16px}.modal-card h2{margin:0 0 8px;color:var(--aqua)}.log-entry{border-left:2px solid var(--aqua);padding:7px 9px;margin:8px 0;background:#10233b;font-size:11px;line-height:1.4}.help-list{columns:2;gap:28px;font-size:12px;line-height:1.9;color:#c6d6e8}@media(max-width:1050px){#inspector{display:none}#status{display:none}}@media(max-width:750px){#catalog{width:250px}#conditions{left:273px;width:calc(100vw - 288px)}.logo{font-size:13px}.top .btn:not(.primary){display:none}}
</style></head><body>
<canvas id="playground"></canvas>
<header class="top panel"><div class="logo">CHEMLAB <span>2D SANDBOX</span></div><button class="btn primary" id="modeToggle">NORMAL MODE</button><button class="btn" id="undo">↶ UNDO</button><button class="btn" id="redo">↷ REDO</button><button class="btn" id="save">SAVE</button><button class="btn" id="load">LOAD</button><button class="btn" id="notebook">NOTEBOOK</button><div class="spacer"></div><button class="btn" id="gridToggle">GRID</button><button class="btn" id="help">? HELP</button><button class="btn danger" id="clear">CLEAR</button></header>
<aside id="catalog" class="panel"><nav class="tabs"><button class="tab active" data-tab="elements">ELEMENTS</button><button class="tab" data-tab="compounds">COMPOUNDS</button><button class="tab" data-tab="utilities">TOOLS</button><button class="tab" data-tab="scene">SCENE</button></nav><div class="catalog-body" id="catalogBody"></div></aside>
<aside id="inspector" class="panel"></aside>
<section id="conditions" class="panel"><div class="condition-head"><b>SIMULATION CONDITIONS</b><button class="btn" id="pause">Ⅱ PAUSE</button></div><div class="controls"><label class="control">Temperature<input id="temperature" type="range" min="4" max="1500" value="293"><output id="temperatureOut"></output></label><label class="control">Pressure<input id="pressure" type="range" min="10" max="500" value="100"><output id="pressureOut"></output></label><label class="control">Gravity<input id="gravity" type="range" min="-15" max="15" value="10"><output id="gravityOut"></output></label><label class="control">Speed<input id="speed" type="range" min="0" max="20" value="10"><output id="speedOut"></output></label></div></section>
<div id="status" class="panel"><span class="dot"></span><span id="statusText">EMPTY PLAYGROUND · E TO SPAWN</span></div><div id="toast" class="panel"></div><div id="context" class="context panel"></div>
<section id="modal" class="modal"><div class="modal-card panel"><button class="btn danger" id="closeModal" style="float:right">CLOSE</button><div id="modalContent"></div></div></section>
<script src="./vendor/matter.min.js"></script><script type="module" src="./game.js"></script></body></html>
